# Cópia de referência do workflow que avisa o site quando uma versão é publicada.
# O arquivo em uso mora em .github/workflows/ do repositório público gwen-org/gwen (ADR-016).
# Quem publica a Release é o release.yml do gwen-app, mas o evento acontece no gwen.
#
# Segredo necessário no repositório gwen (Settings > Secrets and variables > Actions):
#   VERCEL_DEPLOY_HOOK   URL do Deploy Hook do projeto gwen-site na Vercel

name: notify-site

on:
  release:
    types: [published, edited]

jobs:
  deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Refazer o build do site
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK não configurado"; exit 0; fi
          curl -fsS -X POST "$HOOK"
